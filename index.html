<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>查询系统</title>
    <style>
        /* 默认隐藏内容区 */
        .page {
            display: none;
            margin-top: 20px;
        }
        /* 首页默认显示 */
        #home {
            display: block;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 首页区域 -->
<div id="home" class="page">
    <h1>欢迎使用查询系统</h1>
    <!-- 关键按钮：onclick 写对了 -->
    <button onclick="goToQuery()">进入查询面板</button>
</div>

<!-- 查询面板区域（默认隐藏） -->
<div id="query" class="page">
    <h1>✅ 查询面板</h1>
    <p>这里可以放你的查询内容、表单等</p>
    <button onclick="goToHome()">返回首页</button>
</div>

<script>
// 切换到查询面板
function goToQuery() {
    document.getElementById('home').style.display = 'none';
    document.getElementById('query').style.display = 'block';
}

// 切换回首页
function goToHome() {
    document.getElementById('query').style.display = 'none';
    document.getElementById('home').style.display = 'block';
}
</script>

</body>
</html>
