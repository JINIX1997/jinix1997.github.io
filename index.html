<style>
  /* 全局基础样式 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* 主页面容器：极简居中 */
  #home {
    width: 100vw;
    height: 100vh;
    background: #0B1120;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 30px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  /* 主页面标题 */
  .home-title {
    font-size: 28px;
    color: #fff;
    font-weight: bold;
    text-align: center;
  }

  /* 进入按钮 */
  .enter-btn {
    padding: 14px 36px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .enter-btn:hover {
    background: #2563eb;
    transform: translateY(-3px);
  }

  /* 子页面默认隐藏 */
  #subPage {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease;
  }

  /* 切换动画 */
  #home.hidden {
    opacity: 0;
    visibility: hidden;
  }

  #subPage.show {
    opacity: 1;
    visibility: visible;
  }
</style>
</head>
<body>

</div>

  <style>
/* ===== CSS Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0B1120;
  --bg-secondary: #111827;
  --bg-card: #1a2332;
  --bg-card-hover: #1e2d3d;
  --border-color: #1e3a5f;
  --border-glow: #1e6dd9;
  --accent-blue: #3b82f6;
  --accent-gold: #f59e0b;
  --accent-cyan: #06b6d4;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --visa-free: #10b981;
  --visa-arrival: #f59e0b;
  --visa-evisa: #3b82f6;
  --visa-required: #ef4444;
  --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3), 0 0 40px rgba(59, 130, 246, 0.1);
  --glow-gold: 0 0 20px rgba(245, 158, 11, 0.3), 0 0 40px rgba(245, 158, 11, 0.1);
}

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== Animated Background ===== */
.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.bg-glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  pointer-events: none;
  z-index: 0;
}
.bg-glow--blue { width: 600px; height: 600px; background: var(--accent-blue); top: -200px; right: -100px; }
.bg-glow--gold { width: 500px; height: 500px; background: var(--accent-gold); bottom: -150px; left: -100px; }

/* ===== Layout ===== */
.page-wrapper {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 60px 0 40px;
  animation: fadeInDown 0.8s ease-out;
}
.header__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(245,158,11,0.2));
  border: 1px solid rgba(59,130,246,0.3);
  margin-bottom: 24px;
  animation: float 4s ease-in-out infinite;
}
.header__icon svg { width: 36px; height: 36px; }
.header__title {
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #f1f5f9 0%, #3b82f6 50%, #f59e0b 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
}
.header__subtitle {
  color: var(--text-secondary);
  font-size: 1.05rem;
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.6;
}

/* ===== Stats Row ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 48px;
  animation: fadeInUp 0.8s ease-out 0.2s both;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
}
.stat-card--free::before { background: linear-gradient(90deg, var(--visa-free), #34d399); }
.stat-card--arrival::before { background: linear-gradient(90deg, var(--visa-arrival), #fbbf24); }
.stat-card--evisa::before { background: linear-gradient(90deg, var(--visa-evisa), #60a5fa); }
.stat-card--required::before { background: linear-gradient(90deg, var(--visa-required), #f87171); }

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--glow-blue);
}
.stat-card__icon {
  display: inline-flex;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}
.stat-card--free .stat-card__icon { background: rgba(16, 185, 129, 0.15); }
.stat-card--arrival .stat-card__icon { background: rgba(245, 158, 11, 0.15); }
.stat-card--evisa .stat-card__icon { background: rgba(59, 130, 246, 0.15); }
.stat-card--required .stat-card__icon { background: rgba(239, 68, 68, 0.15); }

.stat-card__number {
  font-size: 2.4rem;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}
.stat-card--free .stat-card__number { color: var(--visa-free); }
.stat-card--arrival .stat-card__number { color: var(--visa-arrival); }
.stat-card--evisa .stat-card__number { color: var(--visa-evisa); }
.stat-card--required .stat-card__number { color: var(--visa-required); }

.stat-card__label {
  font-size: 0.85rem;
  color: var(--text-secondary);
  font-weight: 500;
}

/* ===== Filters ===== */
.filters {
  margin-bottom: 32px;
  animation: fadeInUp 0.8s ease-out 0.4s both;
}
.filters__group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  align-items: center;
}
.filters__label {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  min-width: 80px;
}
.filter-btn {
  padding: 8px 18px;
  border-radius: 100px;
  border: 1px solid var(--border-color);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: inherit;
  white-space: nowrap;
}
.filter-btn:hover {
  border-color: var(--accent-blue);
  color: var(--text-primary);
  background: rgba(59, 130, 246, 0.1);
}
.filter-btn.active {
  background: rgba(59, 130, 246, 0.2);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
  font-weight: 600;
  box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
}
.filter-btn--free.active { background: rgba(16,185,129,0.2); border-color: var(--visa-free); color: var(--visa-free); box-shadow: 0 0 12px rgba(16,185,129,0.2); }
.filter-btn--arrival.active { background: rgba(245,158,11,0.2); border-color: var(--visa-arrival); color: var(--visa-arrival); box-shadow: 0 0 12px rgba(245,158,11,0.2); }
.filter-btn--evisa.active { background: rgba(59,130,246,0.2); border-color: var(--visa-evisa); color: var(--visa-evisa); box-shadow: 0 0 12px rgba(59,130,246,0.2); }
.filter-btn--required.active { background: rgba(239,68,68,0.2); border-color: var(--visa-required); color: var(--visa-required); box-shadow: 0 0 12px rgba(239,68,68,0.2); }

/* ===== Section Title ===== */
.section-title {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: fadeInUp 0.6s ease-out both;
}
.section-title__bar {
  width: 4px;
  height: 24px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--accent-blue), var(--accent-gold));
}

/* ===== Country Grid ===== */
.countries-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-bottom: 64px;
}
.country-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 20px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: default;
  position: relative;
  overflow: hidden;
  opacity: 1;
  transform: translateY(0);
}
.country-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(59, 130, 246, 0.06), transparent 60%);
}
.country-card:hover {
  transform: translateY(-6px);
  border-color: rgba(59, 130, 246, 0.4);
  box-shadow: var(--glow-blue), 0 20px 40px rgba(0,0,0,0.3);
}
.country-card:hover::after { opacity: 1; }

.country-card.hiding {
  opacity: 0;
  transform: translateY(10px) scale(0.96);
  pointer-events: none;
}
.country-card.showing {
  animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.country-card__top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.country-card__flag {
  font-size: 2rem;
  line-height: 1;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  flex-shrink: 0;
}
.country-card__name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
}
.country-card__continent {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.country-card__badge {
  margin-left: auto;
  flex-shrink: 0;
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.badge-free { background: rgba(16,185,129,0.15); color: var(--visa-free); border: 1px solid rgba(16,185,129,0.3); }
.badge-arrival { background: rgba(245,158,11,0.15); color: var(--visa-arrival); border: 1px solid rgba(245,158,11,0.3); }
.badge-evisa { background: rgba(59,130,246,0.15); color: var(--visa-evisa); border: 1px solid rgba(59,130,246,0.3); }
.badge-required { background: rgba(239,68,68,0.15); color: var(--visa-required); border: 1px solid rgba(239,68,68,0.3); }

.country-card__details {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
}
.country-card__detail {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}
.country-card__detail svg { width: 14px; height: 14px; opacity: 0.7; }

.country-card__note {
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.5;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

/* ===== Top 5 Section ===== */
.top5-section {
  margin-bottom: 64px;
  animation: fadeInUp 0.8s ease-out 0.6s both;
}
.top5-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.top5-card {
  background: linear-gradient(135deg, var(--bg-card), rgba(30, 41, 59, 0.6));
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 24px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}
.top5-card::before {
  content: attr(data-rank);
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 2.5rem;
  font-weight: 900;
  color: rgba(245, 158, 11, 0.1);
  line-height: 1;
}
.top5-card:hover {
  transform: translateY(-4px);
  border-color: rgba(245, 158, 11, 0.4);
  box-shadow: var(--glow-gold);
}
.top5-card__rank {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent-gold), #f97316);
  color: #000;
  font-size: 0.8rem;
  font-weight: 800;
  margin-bottom: 14px;
}
.top5-card__flag {
  font-size: 1.6rem;
  margin-bottom: 8px;
}
.top5-card__name {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 12px;
}
.top5-card__meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.top5-card__meta-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}
.top5-card__meta-item svg { width: 14px; height: 14px; flex-shrink: 0; }
.top5-card__meta-item span { color: var(--text-primary); font-weight: 500; }

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 40px 0;
  color: var(--text-muted);
  font-size: 0.8rem;
  border-top: 1px solid rgba(255,255,255,0.05);
}

/* ===== No Results ===== */
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  animation: fadeIn 0.4s ease;
}
.no-results svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5; }
.no-results p { font-size: 1rem; }

/* ===== Animations ===== */
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes countUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .header { padding: 40px 0 24px; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 16px; }
  .stat-card__number { font-size: 1.8rem; }
  .countries-grid { grid-template-columns: 1fr; }
  .top5-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .filters__group { gap: 6px; }
  .filter-btn { padding: 6px 12px; font-size: 0.78rem; }
}
@media (max-width: 480px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .page-wrapper { padding: 0 12px; }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
